[package]
name = "tdlib-rs"
version = "1.2.0"
authors = [
    "Federico Bruzzone <federico.bruzzone.i@gmail.com>",
    "Andrea Longoni",
]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/fifteenlabs/tdlib-rs"
repository = "https://github.com/fifteenlabs/tdlib-rs"
documentation = "https://docs.rs/tdlib-rs"
keywords = ["telegram", "tdlib", "tdjson", "tdlib-rs", "telegram-api"]
description = "Rust wrapper around the Telegram Database Library."
readme = "README.md"

[package.metadata.docs.rs]
features = ["docs", "bots-only-api"]

[package.metadata.system-deps]
tdjson = "1.8.60"

[features]
# The default feature build the library using the local tdlib library
default = []
# This feature is used to enable the functions only available to the Telegram bots
bots-only-api = []
# This feature is used to build the documentation preventing linking to the tdjson library
docs = []
# This feature is used to build the library using the tdlib library installed in the system
local-tdlib = []
# This feature is used to build the library using pkg-config
pkg-config = ["dep:system-deps"]
# This feature is used to build the library using the tdlib library downloaded from github
download-tdlib = ["dep:reqwest", "dep:zip", "dep:tempfile"]
# This feature enables gpui::SharedString instead of String for string types
gpui = ["dep:gpui"]
# This feature derives diesel ToSql / FromSql / AsExpression / FromSqlRow on
# the strongly-typed identifier newtypes in `crate::newtypes`, targeting the
# turbo-diesel `Turso` backend.
diesel = ["dep:diesel", "dep:turbo-diesel", "dep:turso"]
# This feature derives `schemars::JsonSchema` (transparent) on the strongly-
# typed identifier newtypes in `crate::newtypes`, so callers embedding them
# in `Action`/`JsonSchema`-derived types don't need per-field
# `#[schemars(with = "i64")]` attribute.
schemars = ["dep:schemars"]
# Build-only mode: only exposes the build module, no FFI linking or runtime code.
# Use this for [build-dependencies] to avoid linking libtdjson into the build script.
build-only = []

[dependencies]
log = "0.4"
futures-channel = "0.3"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.2"
system-deps = { version = "7", optional = true }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zip = { version = "2.0.0", optional = true }
tempfile = { version = "3", optional = true }
dirs = "6.0.0"
gpui = { version = "0.2", optional = true }
diesel = { version = "2.3", optional = true, default-features = false }
schemars = { version = "1.0", optional = true }
turbo-diesel = { path = "../../../appv2/crates/turbo-diesel", optional = true }
turso = { git = "https://github.com/tursodatabase/turso", branch = "main", default-features = false, features = ["pure-rust-crypto"], optional = true }

[build-dependencies]
tdlib-rs-gen = { path = "../tdlib-rs-gen", version = "1.2.0" }
tdlib-rs-parser = { path = "../tdlib-rs-parser", version = "1.2.0" }
system-deps = { version = "7", optional = true }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zip = { version = "2.0.0", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
